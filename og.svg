<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source of og.png, the social preview. After a change, render it to a
    1200x630 PNG. Quick Look draws the fonts but scales a non-square SVG
    unevenly, so set the canvas to 1200x1200, wrap the content in
    translate(0 285), run `qlmanage -t -s 1200`, then `sips -c 630 1200`.
  -->
  <rect width="1200" height="630" fill="#000"/>
  <g transform="translate(96 96)">
    <rect width="88" height="88" rx="20" fill="#f5f5f7"/>
    <g transform="scale(1.375)" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
      <path d="M32 16 L48 48"/>
      <path d="M16 48 L38 48"/>
      <path d="M22 36 L32 16" stroke-dasharray="4 4"/>
    </g>
  </g>
  <text x="92" y="346" font-family="HelveticaNeue-Bold, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4" fill="#f5f5f7">Yuşa Sarısoy</text>
  <text x="96" y="420" font-family="HelveticaNeue-Medium, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="500" letter-spacing="-1" fill="#a1a1a6">Product-Minded iOS Engineer</text>
  <text x="96" y="534" font-family="HelveticaNeue-Medium, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" fill="#2997ff">6+ years · 15+ live apps · Istanbul and Berlin</text>
</svg>
