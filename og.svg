<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source of og.png, the social preview. After a change, render it to a
    1200x630 PNG. Quick Look draws the fonts but scales a non-square SVG
    unevenly, so set the canvas to 1200x1200, wrap the content in
    translate(0 285), run `qlmanage -t -s 1200`, then `sips -c 630 1200`.
  -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <g transform="translate(140 140)">
    <circle r="40" fill="none" stroke="#3a3a38" stroke-width="2"/>
    <circle r="8" fill="#ecebe6"/>
  </g>
  <text x="92" y="372" font-family="HelveticaNeue-Light, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="300" letter-spacing="-4" fill="#ecebe6">Yuşa Sarısoy</text>
  <text x="96" y="440" font-family="HelveticaNeue, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="400" letter-spacing="-1" fill="#b5b4ae">I think like a user, build like an engineer.</text>
  <text x="96" y="550" font-family="Menlo, 'SF Mono', monospace" font-size="24" fill="#8b8a84">iOS engineer · 6+ years · 15+ live apps</text>
  <text x="1104" y="550" text-anchor="end" font-family="Menlo, 'SF Mono', monospace" font-size="24" fill="#8b8a84">yusasarisoy.com</text>
</svg>
